name: CodeVerse quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_SOFTWARE_RENDERING: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeverse-browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/evidence/g1/
          retention-days: 14
